name: Device Recovery Toolkit - Windows checks
on:
  push:
    paths:
      - 'tools/ipad-legacy-assistant/**'
      - 'data/legacy-device-compatibility.csv'
      - '.github/workflows/ipad-legacy-assistant.yml'
  pull_request:
    paths:
      - 'tools/ipad-legacy-assistant/**'
      - 'data/legacy-device-compatibility.csv'
      - '.github/workflows/ipad-legacy-assistant.yml'
  workflow_dispatch:
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original iPad Legacy Assistant
        shell: powershell
        run: '& .\tools\ipad-legacy-assistant\tests\Smoke.Tests.ps1'
      - name: Validate universal toolkit, privacy and ownership gates
        shell: powershell
        run: '& .\tools\ipad-legacy-assistant\tests\Universal.Tests.ps1'
      - name: Package portable Windows and Mac helpers
        shell: powershell
        run: |
          Compress-Archive -Path .\tools\ipad-legacy-assistant\DeviceRecovery.Core.psm1,.\tools\ipad-legacy-assistant\DeviceRecoveryToolkit.ps1,.\tools\ipad-legacy-assistant\Start-Device-Recovery-Toolkit.cmd,.\tools\ipad-legacy-assistant\DeviceRecovery-Mac.sh,.\tools\ipad-legacy-assistant\iPadLegacyAssistant.ps1,.\tools\ipad-legacy-assistant\Launch-iPad-Legacy-Assistant.cmd,.\tools\ipad-legacy-assistant\README.md,.\data\legacy-device-compatibility.csv -DestinationPath .\Universal-Device-Recovery-Toolkit-Windows.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: Universal-Device-Recovery-Toolkit-Windows
          path: Universal-Device-Recovery-Toolkit-Windows.zip
          if-no-files-found: error
