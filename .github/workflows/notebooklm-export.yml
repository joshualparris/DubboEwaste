name: Build NotebookLM 100 PDF research pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_notebooklm_original_pdf_pack.py'
      - 'notebooklm/notebooklm_100_original_sources.json'
      - '.github/workflows/notebooklm-export.yml'

concurrency:
  group: notebooklm-original-pack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-notebooklm-pack:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate pack definition without downloading 55 publisher PDFs
        run: |
          python -m py_compile scripts/build_notebooklm_original_pdf_pack.py
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          config_path = Path("notebooklm/notebooklm_100_original_sources.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))

          repo_docs = config["repo_documents"]
          sources = config["external_sources"]

          assert len(repo_docs) == 44, f"Expected 44 repo documents, got {len(repo_docs)}"
          assert len(sources) == 55, f"Expected 55 external PDFs, got {len(sources)}"

          missing = [path for path in repo_docs if not Path(path).is_file()]
          assert not missing, f"Missing repository documents: {missing}"

          urls = []
          for source in sources:
              assert source.get("title"), f"Missing title: {source}"
              url = source.get("url", "")
              parsed = urlparse(url)
              assert parsed.scheme == "https" and parsed.netloc, f"Invalid HTTPS source URL: {url}"
              urls.append(url)

          assert len(urls) == len(set(urls)), "Duplicate external source URL found"
          print("NotebookLM definition valid: 44 repo documents + 55 publisher PDFs + 1 generated index = 100 PDFs.")
          PY

  build-notebooklm-pack:
    # One-time push build is enabled here to produce the requested corrected pack now.
    # The generated commit includes [skip ci], preventing a build loop.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF build dependencies
        run: python -m pip install --disable-pip-version-check requests reportlab pypdf

      - name: Build corrected pack from original online PDFs
        run: |
          python scripts/build_notebooklm_original_pdf_pack.py
          test "$(find notebooklm/2026-10-06-100-pdf-pack/pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')" = "100"
          python - <<'PY'
          import json, zipfile
          from pathlib import Path

          root = Path("notebooklm/2026-10-06-100-pdf-pack")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["pdf_count"] == 100
          assert manifest["repo_document_count"] == 44
          assert manifest["original_online_pdf_count"] == 55

          with zipfile.ZipFile(root / "DubboEwaste-NotebookLM-100-PDF-Pack.zip") as z:
              pdfs = [name for name in z.namelist() if name.lower().endswith(".pdf")]
          assert len(pdfs) == 100, len(pdfs)
          print("Verified corrected ZIP: exactly 100 PDFs, including 55 original publisher PDFs.")
          PY

      - name: Commit corrected research pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notebooklm/2026-10-06-100-pdf-pack
          if git diff --cached --quiet; then
            echo "Corrected pack already matches repository."
          else
            git commit -m "Replace NotebookLM summaries with original source PDFs [skip ci]"
            git push
          fi
