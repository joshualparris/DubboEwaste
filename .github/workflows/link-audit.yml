name: External link audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_project_links_live.py'
      - 'scripts/check_links.py'
      - 'scripts/check_documentation.py'
      - 'docs/DOCUMENTATION-INVENTORY-AND-FRESHNESS-2026-10-09.md'
      - '.github/workflows/link-audit.yml'
  workflow_dispatch:
  schedule:
    # Live external links drift independently of commits; audit weekly.
    - cron: '23 19 * * 0'

concurrency:
  group: external-link-audit
  cancel-in-progress: true

jobs:
  project-links:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe Projects directory destinations
        run: python scripts/check_project_links_live.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: projects-links-live-audit
          path: projects-links-live.json

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify documentation inventory and current internal references
        run: python scripts/check_documentation.py
      - name: Check every external link
        if: always()
        run: python scripts/check_links.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-link-audit
          path: |
            link-audit.md
            link-audit.json
