name: Evidence Validation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'data/evidence.yaml'
      - 'scripts/validate_evidence.py'
      - 'scripts/validate_pilot_tracker.py'
      - 'scripts/triage_intake.py'
      - 'scripts/analyse_pilot.py'
      - 'examples/synthetic-intake.json'
      - '.github/workflows/evidence-validation.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Run evidence validator
        run: python scripts/validate_evidence.py
      - name: Run pilot tracker validator
        run: python scripts/validate_pilot_tracker.py
      - name: Compile and smoke-test agent tools
        run: |
          python -m py_compile scripts/*.py
          python scripts/triage_intake.py examples/synthetic-intake.json > /tmp/triage.json
          python scripts/analyse_pilot.py pilot-tracker.csv > /tmp/pilot-summary.json
