name: Android reuse app (APK)
# The README referred to this workflow but it did not exist, so no APK had ever been built.
on:
  workflow_dispatch:
  push:
    paths: ['android-reuse-app/**', '.github/workflows/android-reuse-app.yml']
  pull_request:
    paths: ['android-reuse-app/**', '.github/workflows/android-reuse-app.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-reuse-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" dubbo-reuse-debug.apk
          sha256sum dubbo-reuse-debug.apk > dubbo-reuse-debug.apk.sha256
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging dubbo-reuse-debug.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: dubbo-reuse-debug-apk
          path: |
            android-reuse-app/dubbo-reuse-debug.apk
            android-reuse-app/dubbo-reuse-debug.apk.sha256
