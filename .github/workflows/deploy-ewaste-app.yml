name: Deploy EwasteApp to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'EwasteApp/**'
      - '.github/workflows/deploy-ewaste-app.yml'

jobs:
  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EwasteApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy             --prod             --yes             --token "$VERCEL_TOKEN"             --scope "joshualparris-projects"
