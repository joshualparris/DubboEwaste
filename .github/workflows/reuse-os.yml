name: ReuseOS PC image
on:
  workflow_dispatch:
  push:
    paths:
      - 'reuse-os/**'
      - '.github/workflows/reuse-os.yml'
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian live ISO in disposable container
        run: |
          mkdir -p reuseos-output
          docker run --rm --privileged -v "$PWD/reuse-os:/source:ro" -v "$PWD/reuseos-output:/output" debian:trixie bash -ec 'apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools ca-certificates; bash /source/build-pc.sh /output'
          cd reuseos-output
          sha256sum -c SHA256SUMS
      - name: Boot from ISO in QEMU without hard disk
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          timeout 360 qemu-system-x86_64 -m 3072 -smp 2 -boot d -cdrom reuseos-output/reuseos-amd64.iso -display none -serial file:reuseos-output/boot.log -monitor none -nic none -no-reboot &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 170); do
            if grep -q REUSEOS_BOOT_OK reuseos-output/boot.log 2>/dev/null; then echo 'Live ISO reached multi-user target'; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          cat reuseos-output/boot.log || true
          echo 'No verified boot marker' >&2
          exit 1
      - name: Upload build and boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReuseOS-amd64
          path: reuseos-output/
          if-no-files-found: warn
