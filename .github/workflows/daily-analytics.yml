name: Daily aggregate website analytics
on:
  schedule:
    - cron: "34 3 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-analytics
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
      - name: Export aggregated statistics only
        env:
          ANALYTICS_SITE: dubbo_ewaste
          ANALYTICS_SUPABASE_URL: ${{ secrets.ANALYTICS_SUPABASE_URL }}
          ANALYTICS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ANALYTICS_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          : "${ANALYTICS_SUPABASE_URL:?Set this Actions secret}"
          : "${ANALYTICS_SUPABASE_SERVICE_ROLE_KEY:?Set this Actions secret}"
          python3 EwasteApp/scripts/export_analytics.py
      - name: Commit summaries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/analytics/
          if ! git diff --cached --quiet; then
            git commit -m "Daily anonymous site analytics"
            git push
          fi
