name: Build NotebookLM 100 PDF research pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_notebooklm_100_pdf_pack.py'
      - 'notebooklm/notebooklm_100_sources.json'
      - '.github/workflows/notebooklm-export.yml'

permissions:
  contents: write

jobs:
  build-notebooklm-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF build dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Build and verify 100-PDF pack
        run: |
          python scripts/build_notebooklm_100_pdf_pack.py
          test "$(find notebooklm/2026-10-06-100-pdf-pack/pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')" = "100"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path("notebooklm/2026-10-06-100-pdf-pack/DubboEwaste-NotebookLM-100-PDF-Pack.zip")
          with zipfile.ZipFile(p) as z:
              pdfs=[n for n in z.namelist() if n.lower().endswith(".pdf")]
          assert len(pdfs)==100, len(pdfs)
          print("Verified ZIP contains exactly 100 PDFs")
          PY

      - name: Commit generated research pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooklm/2026-10-06-100-pdf-pack
          if git diff --cached --quiet; then
            echo "Generated pack already matches repository."
          else
            git commit -m "Build NotebookLM 100-PDF Dubbo eWaste research pack [skip ci]"
            git push
          fi

      - name: Upload short-lived download artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubboEwaste-NotebookLM-100-PDF-Pack
          path: notebooklm/2026-10-06-100-pdf-pack/pdfs/*.pdf
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
