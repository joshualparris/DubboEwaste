name: Daily privacy-safe website analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-analytics.yml'
      - 'EwasteApp/scripts/export_analytics.py'
  schedule:
    - cron: "34 3 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-website-analytics
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch yesterday's anonymous aggregates
        run: |
          set -euo pipefail
          python3 -m py_compile EwasteApp/scripts/export_analytics.py
          python3 EwasteApp/scripts/export_analytics.py
      - name: Commit daily totals to this repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/analytics/
          if ! git diff --cached --quiet; then
            git commit -m "Daily privacy-safe site analytics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
